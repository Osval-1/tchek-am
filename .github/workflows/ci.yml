name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tchekam
          POSTGRES_PASSWORD: tchekam
          POSTGRES_DB: tchekam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tchekam -d tchekam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tchekam:tchekam@localhost:5432/tchekam
      S3_ENDPOINT_URL: http://localhost:8333
      S3_BUCKET: tchekam-evidence
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      # A step rather than a service container: the s3.json config must be mounted from the checkout.
      - name: Start SeaweedFS (S3) and create bucket
        run: |
          docker run -d --name seaweedfs -p 8333:8333 -p 9333:9333 \
            -v "$GITHUB_WORKSPACE/docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.54 \
            server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          ready=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9333/cluster/status >/dev/null; then ready=1; break; fi
            sleep 2
          done
          [ "$ready" = 1 ] || { echo "SeaweedFS master never became ready"; docker logs seaweedfs; exit 1; }
          echo "s3.bucket.create -name tchekam-evidence" | docker exec -i seaweedfs weed shell -master=localhost:9333
          # Any HTTP response (even 403) means the S3 gateway is listening.
          ready=0
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8333; then ready=1; break; fi
            sleep 2
          done
          [ "$ready" = 1 ] || { echo "S3 gateway never became ready"; docker logs seaweedfs; exit 1; }
          echo "s3.bucket.list" | docker exec -i seaweedfs weed shell -master=localhost:9333 | grep tchekam-evidence
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Runs unit and integration tests; the latter hit the SeaweedFS started above.
      - run: uv run pytest
      # The reputation engine decides public bands; every branch must be exercised.
      - name: Reputation engine branch coverage
        run: >-
          uv run pytest tests/reputation --cov=tchekam.reputation --cov-branch
          --cov-report=term-missing --cov-fail-under=100

  # Builds the production image and checks that the container really serves /healthz.
  image:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tchekam
          POSTGRES_PASSWORD: tchekam
          POSTGRES_DB: tchekam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tchekam -d tchekam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tchekam .
      - name: Serve /healthz from the container
        run: |
          # Dummy values: prod settings refuse to start without them. Host networking lets the
          # container reach the Postgres service on localhost.
          cat > container.env <<'EOF'
          DATABASE_URL=postgres://tchekam:tchekam@localhost:5432/tchekam
          SECRET_KEY=ci-only-secret-key-ci-only-secret-key-ci-only-secret-key
          ALLOWED_HOSTS=localhost
          S3_ENDPOINT_URL=http://localhost:8333
          S3_BUCKET=x
          S3_ACCESS_KEY=x
          S3_SECRET_KEY=x
          WASENDER_API_KEY=x
          WASENDER_WEBHOOK_SECRET=x
          TERMS_URL=http://localhost/terms
          REPORTER_KEY_SECRET=ci-only-reporter-key
          ANTHROPIC_API_KEY=x
          GROQ_API_KEY=x
          SERPAPI_API_KEY=x
          EMBEDDER_BACKEND=fake
          EOF
          docker run --rm --network host --env-file container.env tchekam python src/manage.py migrate --noinput
          docker run -d --name web --network host --env-file container.env tchekam
          ready=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/healthz | grep -q '"ok"'; then ready=1; break; fi
            sleep 2
          done
          [ "$ready" = 1 ] || { echo "/healthz never answered"; docker logs web; exit 1; }
          # The same image must also start the worker.
          docker run --rm --network host --env-file container.env tchekam \
            sh -c 'timeout 10 python src/manage.py procrastinate worker -q default,whatsapp --concurrency 8; [ $? -eq 124 ]'
