name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tchekam
          POSTGRES_PASSWORD: tchekam
          POSTGRES_DB: tchekam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tchekam -d tchekam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tchekam:tchekam@localhost:5432/tchekam
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
