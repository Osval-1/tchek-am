# Opt-in synthetic-only stack, derived from upstream 0eaa455d26f004bffa82dcc3807b861445df119f.
# Supply isolated local secrets via --env-file .scratch/langfuse.env. No application DB is reused.
name: tchekam-langfuse-local
services:
  worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.84.0
    depends_on: &dependencies
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      minio: {condition: service_started}
    environment: &environment
      DATABASE_URL: postgresql://langfuse:${LF_POSTGRES_PASSWORD:?required}@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3100
      SALT: ${LF_SALT:?required}
      ENCRYPTION_KEY: ${LF_ENCRYPTION_KEY:?required}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LF_CLICKHOUSE_PASSWORD:?required}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LF_REDIS_PASSWORD:?required}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LF_MINIO_PASSWORD:?required}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LF_MINIO_PASSWORD:?required}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
      LANGFUSE_IN_APP_AGENT_ENABLED: "false"
  web:
    image: docker.langfuse.com/langfuse/langfuse:4.84.0
    depends_on: *dependencies
    ports: ["127.0.0.1:3100:3000"]
    environment:
      <<: *environment
      NEXTAUTH_SECRET: ${LF_NEXTAUTH_SECRET:?required}
      LANGFUSE_INIT_ORG_ID: synthetic-local
      LANGFUSE_INIT_ORG_NAME: Synthetic local trial
      LANGFUSE_INIT_PROJECT_ID: synthetic-agent
      LANGFUSE_INIT_PROJECT_NAME: Synthetic agent metadata
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LF_PUBLIC_KEY:?required}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LF_SECRET_KEY:?required}
      LANGFUSE_INIT_USER_EMAIL: synthetic@localhost.test
      LANGFUSE_INIT_USER_NAME: Synthetic developer
      LANGFUSE_INIT_USER_PASSWORD: ${LF_USER_PASSWORD:?required}
  postgres:
    image: postgres:17.7
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LF_POSTGRES_PASSWORD:?required}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "langfuse"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.2
    command: ["redis-server", "--requirepass", "${LF_REDIS_PASSWORD:?required}", "--maxmemory-policy", "noeviction"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LF_REDIS_PASSWORD:?required}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.62.3
    environment:
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LF_CLICKHOUSE_PASSWORD:?required}
    volumes: ["clickhouse:/var/lib/clickhouse", "clickhouse_logs:/var/log/clickhouse-server"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: cgr.dev/chainguard/minio@sha256:f2e56aceb4d38ad9b05c901270946e2353b19f86ba4396f25cf75b15b455b38c
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /data/langfuse && minio server --address :9000 /data"]
    environment:
      MINIO_ROOT_USER: langfuse
      MINIO_ROOT_PASSWORD: ${LF_MINIO_PASSWORD:?required}
    volumes: ["minio:/data"]
volumes:
  postgres:
  redis:
  clickhouse:
  clickhouse_logs:
  minio:
