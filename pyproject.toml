[project]
name = "tchekam"
version = "0.1.0"
description = "Tchek-Am: WhatsApp scam-check bot for Cameroon"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.12",
    "psycopg[binary]>=3.2",
    "pgvector>=0.4",
    "procrastinate[django]>=3",
    "httpx>=0.27",
    "boto3>=1.44.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tchekam.settings.test"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: tests that touch external services or the full stack",
    "ml: tests that load ML models",
    "slow: slow tests",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["docs", ".scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
