[project]
name = "tchekam"
version = "0.1.0"
description = "Tchek-Am: WhatsApp scam-check bot for Cameroon"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.12",
    "psycopg[binary]>=3.2",
    "pgvector>=0.4",
    "procrastinate[django]>=3",
    "httpx>=0.27",
    "boto3>=1.44.9",
    "phonenumbers>=9.0.44",
    "anthropic>=2.12.0",
    "pillow>=13.0.0",
    "django-otp>=1.7.5",
    "qrcode>=8.2",
    "imagehash>=4.3.2",
    "sentry-sdk>=2.0,<3",
    "whitenoise>=6.12.0",
    "gunicorn>=27.0.1",
    "langchain==1.5.2",
    "langgraph==1.2.24",
    "langchain-openrouter==0.3.0",
    "langfuse==3.15.0",
]

[project.optional-dependencies]
# Heavy CPU-only ML stack for the real image embedder. CI skips it; tests use FakeEmbedder.
ml = [
    "torch>=2.4",
    "open_clip_torch>=2.26",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "langgraph-cli[inmem]==0.4.43",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.9",
    "pyyaml>=6.0.4",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tchekam.settings.test"
pythonpath = ["src"]
testpaths = ["tests"]
# Slow benchmarks are opt-in: run them with `pytest -m slow`. Tests marked `ml` also skip
# themselves when the `ml` extra is not installed.
addopts = "-m 'not slow'"
markers = [
    "integration: tests that touch external services or the full stack",
    "ml: tests that load ML models",
    "slow: slow tests",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["docs", ".scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
# Copy lines carry a trailing "needs native review" marker, so they can exceed the limit.
"src/tchekam/i18n/catalog.py" = ["E501"]
"src/tchekam/i18n/catalog_message.py" = ["E501"]
"src/tchekam/i18n/catalog_appeals.py" = ["E501"]
"src/tchekam/i18n/catalog_agent.py" = ["E501"]
