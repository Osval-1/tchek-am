<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>{% block title %}Moderation{% endblock %} - Tchek-Am</title>
<style>
  body { font: 15px/1.45 system-ui, sans-serif; margin: 0; color: #1b1f23; background: #f6f7f8; }
  header { background: #1b1f23; color: #fff; padding: 10px 20px; }
  header a { color: #fff; margin-right: 16px; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px 20px 60px; }
  section { background: #fff; border: 1px solid #d8dde2; border-radius: 6px; padding: 12px 16px; margin: 14px 0; }
  h1, h2 { margin: 6px 0 10px; } h2 { font-size: 17px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid #e6e9ec; vertical-align: top; }
  .messages { list-style: none; padding: 0; margin: 0; }
  .messages li { padding: 8px 12px; margin: 8px 0; border-radius: 4px; background: #e8f3ff; }
  .messages .error { background: #fde8e8; } .messages .success { background: #e6f6ea; }
  .hint { color: #5b6670; font-size: 13px; }
  .ai { background: #fff8e1; border: 1px dashed #d8b84a; padding: 8px 12px; border-radius: 4px; }
  .gallery { display: flex; flex-wrap: wrap; gap: 12px; }
  .gallery figure { margin: 0; max-width: 320px; }
  .gallery img { max-width: 320px; max-height: 320px; border: 1px solid #ccd; }
  .band { display: inline-block; padding: 1px 8px; border-radius: 10px; color: #fff; }
  .band-green { background: #2e9e4f; } .band-yellow { background: #c9a400; }
  .band-orange { background: #e07a10; } .band-red { background: #c62828; }
  button { padding: 6px 14px; margin: 4px 6px 4px 0; cursor: pointer; }
  .danger { background: #c62828; color: #fff; border: 0; border-radius: 4px; }
  .ok { background: #2e9e4f; color: #fff; border: 0; border-radius: 4px; }
  textarea { width: 100%; box-sizing: border-box; }
</style>
</head>
<body>
<header><a href="{% url 'moderation:queue' %}">Review queue</a> <a href="{% url 'admin:index' %}">Admin</a></header>
<main>
{% if messages %}<ul class="messages">{% for m in messages %}<li class="{{ m.tags }}">{{ m }}</li>{% endfor %}</ul>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
